<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f1f5f9" rx="8"/>
  <rect x="300" y="20" width="200" height="30" fill="#94a3b8" rx="4"/>
  <text x="400" y="42" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">PLACEHOLDER</text>
  <text x="400" y="80" font-family="system-ui" font-size="16" fill="#64748b" text-anchor="middle">Floor plan image not yet available</text>
  <text x="400" y="105" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">This space reserved for the official library floor plan</text>
  <rect x="350" y="140" width="100" height="1" fill="#cbd5e1"/>
  <!-- Grid pattern representing floor plan -->
  <g opacity="0.15">
    <rect x="100" y="170" width="600" height="240" fill="none" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="100" y1="250" x2="700" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="300" y1="170" x2="300" y2="410" stroke="#475569" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="500" y1="170" x2="500" y2="410" stroke="#475569" stroke-width="1" stroke-dasharray="6 4"/>
    <rect x="120" y="190" width="80" height="50" fill="#475569" rx="3"/>
    <rect x="320" y="190" width="80" height="50" fill="#475569" rx="3"/>
    <rect x="520" y="190" width="80" height="50" fill="#475569" rx="3"/>
    <rect x="120" y="270" width="160" height="120" fill="#475569" rx="3"/>
    <rect x="320" y="270" width="160" height="120" fill="#475569" rx="3"/>
    <rect x="520" y="270" width="160" height="120" fill="#475569" rx="3"/>
  </g>
</svg>